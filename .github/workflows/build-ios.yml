name: Build iOS&#10;&#10;on:&#10;  push:&#10;    branches: [ main, master ]&#10;  pull_request:&#10;    branches: [ main, master ]&#10;&#10;env:&#10;  NODE_VERSION: '20'&#10;&#10;jobs:&#10;  build:&#10;    runs-on: macos-latest&#10;    steps:&#10;      - name: Checkout code&#10;        uses: actions/checkout@v4&#10;&#10;      - name: Setup Node.js&#10;        uses: actions/setup-node@v4&#10;        with:&#10;          node-version: ${{ env.NODE_VERSION }}&#10;          cache: 'npm'&#10;&#10;      - name: Install dependencies&#10;        run: npm ci&#10;&#10;      - name: Build web assets&#10;        run: npm run build&#10;&#10;      - name: Setup Capacitor&#10;        run: npx cap sync ios&#10;&#10;      - name: Build iOS (archive)&#10;        run: |&#10;          xcodebuild -workspace ios/App/App.xcworkspace &#10;            -scheme App &#10;            -configuration Release &#10;            -destination generic/platform=iOS &#10;            -archivePath ios/App/build/Archive.xcarchive &#10;            archive&#10;&#10;      - name: Export IPA (unsigned/debug)&#10;        run: |&#10;          xcodebuild -exportArchive &#10;            -archivePath ios/App/build/Archive.xcarchive &#10;            -exportPath ios/App/build/BuildProducts &#10;            -exportOptionsPlist exportOptions-debug.plist&#10;        env:&#10;          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer&#10;&#10;      - name: Upload iOS Archive&#10;        uses: actions/upload-artifact@v4&#10;        with:&#10;          name: ios-archive&#10;          path: ios/App/build/Archive.xcarchive&#10;&#10;      - name: Upload iOS IPA&#10;        uses: actions/upload-artifact@v4&#10;        with:&#10;          name: ios-debug-ipa&#10;          path: ios/App/build/BuildProducts/*.ipa&#10;&#10;  note: Create a minimal exportOptions-debug.plist locally with method="development" if needed, or adjust for ad-hoc.
