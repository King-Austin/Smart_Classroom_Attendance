name: Build Android APK (EAS)

on:
  push:
    branches: [main, claude/review-deployment-readiness-3tEAH]
    paths:
      - 'native/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options: [preview, production]

concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build — Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: native/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install native workspace deps
        working-directory: native
        run: npm ci

      - name: TypeScript check
        working-directory: native
        run: npx tsc --noEmit

      - name: EAS Build (Android)
        working-directory: native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_BIOMETRIC_SERVER_URL: ${{ secrets.EXPO_PUBLIC_BIOMETRIC_SERVER_URL }}
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile || 'preview' }} \
            --non-interactive \
            --no-wait \
            --json | tee /tmp/eas-build.json
          echo "BUILD_URL=$(jq -r '.[0].buildDetailsPageUrl' /tmp/eas-build.json)" >> "$GITHUB_ENV"

      - name: Post build URL to job summary
        run: |
          echo "## Android Build Started" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Profile | \`${{ inputs.profile || 'preview' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build page | $BUILD_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Expo build dashboard once the build completes (~10 min)." >> "$GITHUB_STEP_SUMMARY"
